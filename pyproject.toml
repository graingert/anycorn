[build-system]
requires = ["uv_build>=0.10.9,<0.13.0"]
build-backend = "uv_build"

[project]
name = "anycorn"
version = "0.0.0"
requires-python = ">=3.10"
description = "A fork of Hypercorn that uses AnyIO"
authors = [
    { name = "Philip Graham Jones", email = "philip.graham.jones@googlemail.com" },
    { name = "David Brochart", email = "david.brochart@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = { file = "LICENSE" }
readme = "README.md"
repository = "https://github.com/davidbrochart/anycorn/"

dependencies = [
    "exceptiongroup >=1.1.0,<2.0; python_version<'3.11'",
    "h11",
    "h2 >=3.1.0",
    "hpack",
    "anyio >=4.10.0,<5.0",
    "priority",
    "sniffio >=1.1,<2.0",
    "tomli; python_version<'3.11'",
    "typing_extensions; python_version<'3.11'",
    "wsproto >=0.14.0",
    "rich-click >=1.8.3,<2.0.0",
]

[project.optional-dependencies]
h3 = [
    "aioquic >=1.2.0,<2.0.0",
]
[dependency-groups]
test = [
    "anycorn[h3]",
    "httpx2",
    "pytest>=9.1.1",
    "pytest-cov",
    "covdefaults",
    "mock",
    "starlette",
    "trio",
    "trustme",
]
dev = [
    { include-group = "test" },
    "ruff>=0.15.6",
    "ty>=0.0.22",
]

[project.scripts]
anycorn = "anycorn.__main__:main"

[tool.pytest.ini_options]
addopts = "-W error --showlocals --strict-markers --color=yes -v --cov"
testpaths = ["tests"]
strict = true

[tool.coverage.run]
plugins = ["covdefaults"]
# Resolve anycorn by import name, not by path: it is installed into site-packages (via a
# .pth to src), so a path source of "src/anycorn" would not match the imported module and
# would silently measure nothing. tests is still measured by path.
source_pkgs = ["anycorn"]
source = ["tests"]
# Measure the worker subprocesses run() spawns. anycorn always uses the "spawn" start
# method, so each worker is a fresh interpreter; patch=subprocess sets COVERAGE_PROCESS_CONFIG
# so coverage's install-time .pth starts measurement in that interpreter. Its data lands in
# a parallel-suffixed file that pytest-cov combines with the parent's.
patch = ["subprocess"]

[tool.coverage.report]
omit = [
    # Linux-only test scaffolding. ktls.py (the source) is measured with linux/>=3.12
    # pragmas, but its test modules are skipped wholesale off Linux (kTLS is Linux-only and
    # test_ktls_real.py additionally needs a live kernel tls ULP), so a per-line platform
    # gate cannot express them - they would read as near-zero coverage on the macOS and
    # Windows jobs. Likewise the daemon fixture apps run only inside the POSIX-only daemon
    # tests' subprocesses, so they are never exercised on Windows.
    "*/tests/test_ktls.py",
    "*/tests/e2e/test_ktls_real.py",
    "*/tests/e2e/test_sighup.py",
    "*/tests/assets/daemon_app.py",
    "*/tests/assets/config_daemon_false.py",
]

[tool.ruff]
lint.extend-select = [# https://docs.astral.sh/ruff/settings/#extend-select
    "ALL",
]
lint.extend-ignore = [# https://docs.astral.sh/ruff/settings/#extend-ignore
    "D105", # undocumented-magic-method
    "D107", # undocumented-public-init
    "D203", # one-blank-line-before-class
    "D213", # multi-line-summary-second-line
    "COM812", # https://docs.astral.sh/ruff/rules/missing-trailing-comma/
    "S101", # https://docs.astral.sh/ruff/rules/assert/
    "TD001", # invalid-todo-tag
    "TD002", # missing-todo-author
    "TD003", # missing-todo-link
    "TD004", # missing-todo-colon
    "TD005", # missing-todo-description
    "FIX001", # line-contains-fixme
    "FIX002", # line-contains-todo
]
src = ["src", "tests"]  # https://docs.astral.sh/ruff/settings/#src
line-length = 100

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/**/*.py" = [
    "ANN204",
    "D102",
    "D103",
    "EM101",
    "ERA001",
    "SLF001",
    "TRY003"
]

[tool.ty.rules]
unused-type-ignore-comment = "error"
